[subject]
name = "lru_cache"
crate-path = "."
cdylib-name = "lru_cache"

# No extension points: LruCache's only knob is capacity. Variants operate in
# Full-autonomy scope only (they may rewrite the impl, never the JNI ABI).

[[gates]]
name = "invariant gate"
test = "invariant_gate"
marker = "invariant gate violated: P[1-3] [a-z_]+"

[contract]
protected-files = ["src/lru_cache/lru_cache_jni.rs"]

# Sized solely by --maximumSize, so no tunable geometry and no policy list.
[caffeine]
config-prefix = "caffeine.simulator.lruRust"
policy-spec-name = "lrurust.LruRust"
supports-log-path = false

[bench]
binary-name = "lru_cache-evolve-per-op-time"

[metadata]
binary-name = "lru_cache-evolve-metadata-size"

[docs]
context = "CONTEXT.md"
insight = "baseline/insight.md"

[evaluation]
fitness-vector = "baseline/eval/fitness-vector.json"
traces = ["lirs:inputs/traces/workload-a.trace.gz"]
sizes = [2048]

# MSR Cambridge block-I/O grid (--evaluation-profile msr): both traces crossed
# with both sizes, averaged like the default grid.
[evaluation.profiles.msr]
traces = ["lirs:inputs/traces/msr/web_0.trace.gz", "lirs:inputs/traces/msr/hm_0.trace.gz"]
sizes = [16384, 131072]

[subject]
name = "dash"
crate-path = "."
cdylib-name = "dash"

[[extension-points]]
name = "eviction-policy"
contract = "dash::shared::traits::EvictionPolicy"
impl-files = ["src/shared/eviction_policy.rs"]
description = "Algorithm choosing which item to evict from a bucket"

[[extension-points]]
name = "bucket"
contract = "dash::shared::traits::Bucket"
impl-files = ["src/dash/dash_bucket.rs"]
description = "Container for items within a segment"

[[extension-points]]
name = "item"
contract = "dash::shared::item::Item"
impl-files = ["src/shared/item.rs"]
description = "Storage unit a bucket holds; its layout and metadata co-evolve with the eviction policy that reads them. Keep Item::new(key, value) constructible and the key/value fields present."

[[extension-points]]
name = "segment"
contract = "dash::dash::segments::Segment"
impl-files = ["src/dash/segments/dash_segment.rs"]
description = "The segment's get-time strategy: where items land on a hit and how they migrate between the stash, target, and probing slots. Implements the Segment trait over the shared SegmentCore."

[[extension-points]]
name = "geometry"
contract = "dash::shared::traits::BucketGeometry"
impl-files = ["src/shared/geometry.rs"]
description = "Factors the fixed total capacity into segment count, normal/stash bucket counts, and bucket size. Reshapes topology only; keeps the budget constant."

[[gates]]
name = "invariant gate"
test = "invariant_gate"
marker = "invariant gate violated: P[1-6] [a-z_]+"

[contract]
protected-files = ["src/dash/jni.rs", "src/factory.rs"]

[caffeine]
config-prefix = "caffeine.simulator.dash"
policy-spec-name = "dash.DashRust"
policy-key = "evictionPolicies"
supports-log-path = true

[caffeine.geometry]
numOfNormalBuckets = 2
numOfStashBuckets = 6
bucketSize = 64

[docs]
context = "CONTEXT.md"
insight = "baseline/insight.md"

[evaluation]
fitness-vector = "baseline/eval/fitness-vector.json"
traces = ["lirs:multi1.trace.gz"]
sizes = [512]

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "cargo",
    "gradlew",
    "pytest",
    "src/evolve/cli.py",
]
decision = "allow"
priority = 100
modes = ["default", "plan", "autoEdit"]
allowRedirection = true

[[rule]]
toolName = "activate_skill"
# Using line continuation (\) to keep the list of skills readable.
argsPattern = """
.*"name":\\s*"(\
caffeine-sweep|\
caffeine-sim|\
sim\
)".*"""
decision = "allow"
priority = 100
modes = ["default", "plan", "autoEdit"]
[package]
name = "dash-cache-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "dash"
crate-type = ["cdylib", "lib"]

[features]
test-utils = ["proptest"]

[dependencies]
jni = "0.20.0"
log = "0.4"
simplelog = "0.11"
chrono = "0.4"
rand = "0.8.5"
proptest = { version = "1", optional = true }

[dev-dependencies]
rand = "0.8.5"
proptest = "1"
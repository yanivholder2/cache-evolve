[project]
name = "evolve"
version = "0.1.0"
description = "Agentic research loop for evolving cache policies"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pytest>=7.0",
]

# Every AI-agent backend is optional: a core install pulls in none of them, and
# the backend is chosen explicitly via ai_agent_tool — install the extra for the
# one you pick. (google-antigravity additionally ships no sdist and only
# mac-arm64 + manylinux aarch64/x86_64 wheels, so as a hard dep it would break
# `uv sync` on Windows and macOS-x86.)
[project.optional-dependencies]
claude = ["claude-agent-sdk"]
antigravity = ["google-antigravity"]
ollama = ["ollama"]

[project.scripts]
evolve = "evolve.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end test that drives a real cargo build",
    "caffeine_needed: end-to-end test that requires a caffeine checkout (a `caffeine/` repo sibling by default, or $CAFFEINE_DIR) and a JDK; never run in CI",
]

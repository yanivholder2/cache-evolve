[project]
name = "evolve"
version = "0.1.0"
description = "Agentic research loop for evolving cache policies"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pytest>=7.0",
    "google-antigravity",
    "claude-agent-sdk",
    "ollama",
]

[project.scripts]
evolve = "evolve.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end test that drives a real cargo build",
    "caffeine_needed: end-to-end test that requires a caffeine checkout (a `caffeine/` repo sibling by default, or $CAFFEINE_DIR) and a JDK; never run in CI",
]
